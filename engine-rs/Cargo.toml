[package]
name = "chessbot-engine"
version = "0.1.0"
edition = "2021"
description = "A UCI chess engine (Rust port of the Python chessbot)."

[lib]
name = "chessbot_engine"
path = "src/lib.rs"

[[bin]]
name = "chessbot-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
